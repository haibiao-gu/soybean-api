version: '3.8'

services:
  # 应用服务
  soybean:
    image: soybean-api:v1.0.0
    container_name: soybean-api
    ports:
      - "8080:8080"
    environment:
      - PROFILES_ACTIVE=${PROFILES_ACTIVE:-dev}
      - FLYWAY_ENABLED=${FLYWAY_ENABLED:-false}
      - FLYWAY_CLEAN_DISABLED=${FLYWAY_CLEAN_DISABLED:-true}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_DATABASE=${REDIS_DATABASE}
      - DATASOURCE_URL=${DATASOURCE_URL}
      - DATASOURCE_USERNAME=${DATASOURCE_USERNAME}
      - DATASOURCE_PASSWORD=${DATASOURCE_PASSWORD}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_BUCKET_NAME=${MINIO_BUCKET_NAME}
      - TOKEN_TIMEOUT=${TOKEN_TIMEOUT:-36000}
      - TOKEN_ACTIVE_TIMEOUT=${TOKEN_ACTIVE_TIMEOUT:-3600}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - APP_NAME=${APP_NAME:-DSJY}
      - LOG_PATH=${LOG_PATH:-./logs/}
      - LOG_HISTORY=${LOG_HISTORY:-30}
      - LOG_SIZE=${LOG_SIZE:-100MB}
      - TOKEN_LOG=${TOKEN_LOG:-false}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /home/logs/dsjy:/app/logs
    networks:
      - 1panel-network
    restart: 
       always
    
networks:
  1panel-network:
    external: true
